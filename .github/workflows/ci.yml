name: Heliax CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python scripts/build_native.py
      - run: python -m pytest -q
      - run: HELIAX_NATIVE=1 python -m pytest -q
      - run: python scripts/benchmark_smoke.py
      - run: python scripts/native_report.py
      - run: python -m compileall -q src

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_vendored.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --sdist
      - name: Inspect distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('dist').glob('*'))
          assert any(path.suffix == '.whl' for path in files)
          assert any(path.name.endswith('.tar.gz') for path in files)
          print('\n'.join(path.name for path in files))
          PY
